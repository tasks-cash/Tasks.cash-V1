services:
  mongodb:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    container_name: tasks-cash-mongodb
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongodb:27017\"}]}).ok }' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - tasks-cash-net

  redis:
    image: redis:7-alpine
    container_name: tasks-cash-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - tasks-cash-net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: tasks-cash-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: 4000
      API_URL: http://api:4000
      MONGODB_URI: mongodb://mongodb:27017/taskscash?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      REDIS_DB: "0"
      PAGE_CONTENT_CACHE_ENABLED: "true"
      PAGE_CONTENT_CACHE_VERSION: "v1"
      PAGE_CONTENT_CACHE_TTL_SECONDS: "300"
      PAGE_CONTENT_CACHE_STALE_SECONDS: "900"
      PAGE_CONTENT_CACHE_LOCK_TTL_MS: "15000"
      PAGE_CONTENT_CACHE_LOCK_WAIT_MS: "5000"
      PAGE_CONTENT_CACHE_LOCK_RETRY_MS: "100"
      PAGE_CONTENT_CACHE_DEBUG_HEADERS: "false"
      PAGE_CONTENT_CACHE_DEBUG_LOGS: "true"
      COOKIE_DOMAIN: ""
      COOKIE_SECURE: "false"
      AUTH_COOKIE_DOMAIN: ""
      MIRAAJ_AI_ENABLED: ${MIRAAJ_AI_ENABLED:-false}
      MIRAAJ_AI_BASE_URL: ${MIRAAJ_AI_BASE_URL:-}
      MIRAAJ_AI_API_VERSION: ${MIRAAJ_AI_API_VERSION:-v1}
      MIRAAJ_AI_SERVICE_TOKEN: ${MIRAAJ_AI_SERVICE_TOKEN:-}
      MIRAAJ_AI_CALLBACK_SECRET: ${MIRAAJ_AI_CALLBACK_SECRET:-}
      MIRAAJ_AI_CALLBACK_URL: ${MIRAAJ_AI_CALLBACK_URL:-}
      MIRAAJ_AI_CONNECT_TIMEOUT_MS: ${MIRAAJ_AI_CONNECT_TIMEOUT_MS:-3000}
      MIRAAJ_AI_REQUEST_TIMEOUT_MS: ${MIRAAJ_AI_REQUEST_TIMEOUT_MS:-30000}
      MIRAAJ_AI_HEALTH_CACHE_TTL_SECONDS: ${MIRAAJ_AI_HEALTH_CACHE_TTL_SECONDS:-30}
      MIRAAJ_AI_CAPABILITY_CACHE_TTL_SECONDS: ${MIRAAJ_AI_CAPABILITY_CACHE_TTL_SECONDS:-300}
      MIRAAJ_AI_CAPABILITY_STALE_TTL_SECONDS: ${MIRAAJ_AI_CAPABILITY_STALE_TTL_SECONDS:-3600}
      MIRAAJ_AI_WEBHOOK_REPLAY_TTL_SECONDS: ${MIRAAJ_AI_WEBHOOK_REPLAY_TTL_SECONDS:-900}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tasks-cash-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        JWT_SECRET: ${JWT_SECRET}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MAIN_APP_URL: ${NEXT_PUBLIC_MAIN_APP_URL}
        NEXT_PUBLIC_CHALLENGE_APP_URL: ${NEXT_PUBLIC_CHALLENGE_APP_URL}
        NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL}
    container_name: tasks-cash-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: 3000
      API_URL: http://api:4000
      MONGODB_URI: mongodb://mongodb:27017/taskscash
      REDIS_URL: redis://redis:6380
      COOKIE_DOMAIN: ""
      COOKIE_SECURE: "false"
      AUTH_COOKIE_DOMAIN: ""
    depends_on:
      api:
        condition: service_started
    networks:
      - tasks-cash-net

  challenge:
    build:
      context: .
      dockerfile: Dockerfile.challenge
      args:
        JWT_SECRET: ${JWT_SECRET}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MAIN_APP_URL: ${NEXT_PUBLIC_MAIN_APP_URL}
        NEXT_PUBLIC_CHALLENGE_APP_URL: ${NEXT_PUBLIC_CHALLENGE_APP_URL}
        NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL}
    container_name: tasks-cash-challenge
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: 3001
      API_URL: http://api:4000
      MONGODB_URI: mongodb://mongodb:27017/taskscash
      REDIS_URL: redis://redis:6380
      COOKIE_DOMAIN: ""
      COOKIE_SECURE: "false"
      AUTH_COOKIE_DOMAIN: ""
    depends_on:
      api:
        condition: service_started
    networks:
      - tasks-cash-net

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        JWT_SECRET: ${JWT_SECRET}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MAIN_APP_URL: ${NEXT_PUBLIC_MAIN_APP_URL}
        NEXT_PUBLIC_CHALLENGE_APP_URL: ${NEXT_PUBLIC_CHALLENGE_APP_URL}
        NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL}
    container_name: tasks-cash-admin
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: 3002
      API_URL: http://api:4000
      COOKIE_DOMAIN: ""
      COOKIE_SECURE: "false"
      AUTH_COOKIE_DOMAIN: ""
    depends_on:
      api:
        condition: service_started
    networks:
      - tasks-cash-net

volumes:
  mongo_data:
  redis_data:

networks:
  tasks-cash-net:
    driver: bridge
