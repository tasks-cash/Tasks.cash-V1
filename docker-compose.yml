services:
  mongodb:
    image: mongo:7
    container_name: tasks-cash-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - tasks-cash-net

  redis:
    image: redis:7-alpine
    container_name: tasks-cash-redis
    restart: unless-stopped
    ports:
      - "6380:6380"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - tasks-cash-net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: tasks-cash-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      APP_ENV: development
      PORT: 4000
      API_URL: http://api:4000
      MONGODB_URI: mongodb://mongodb:27017/taskscash
      REDIS_URL: redis://redis:6379
      COOKIE_DOMAIN: ""
      COOKIE_SECURE: "false"
      AUTH_COOKIE_DOMAIN: ""
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tasks-cash-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        JWT_SECRET: ${JWT_SECRET}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MAIN_APP_URL: ${NEXT_PUBLIC_MAIN_APP_URL}
        NEXT_PUBLIC_CHALLENGE_APP_URL: ${NEXT_PUBLIC_CHALLENGE_APP_URL}
        NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL}
    container_name: tasks-cash-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      APP_ENV: development
      PORT: 3000
      API_URL: http://api:4000
      MONGODB_URI: mongodb://mongodb:27017/taskscash
      REDIS_URL: redis://redis:6379
      COOKIE_DOMAIN: ""
      COOKIE_SECURE: "false"
      AUTH_COOKIE_DOMAIN: ""
    depends_on:
      api:
        condition: service_started
    networks:
      - tasks-cash-net

  challenge:
    build:
      context: .
      dockerfile: Dockerfile.challenge
      args:
        JWT_SECRET: ${JWT_SECRET}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MAIN_APP_URL: ${NEXT_PUBLIC_MAIN_APP_URL}
        NEXT_PUBLIC_CHALLENGE_APP_URL: ${NEXT_PUBLIC_CHALLENGE_APP_URL}
        NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL}
    container_name: tasks-cash-challenge
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      APP_ENV: development
      PORT: 3001
      API_URL: http://api:4000
      MONGODB_URI: mongodb://mongodb:27017/taskscash
      REDIS_URL: redis://redis:6379
      COOKIE_DOMAIN: ""
      COOKIE_SECURE: "false"
      AUTH_COOKIE_DOMAIN: ""
    depends_on:
      api:
        condition: service_started
    networks:
      - tasks-cash-net

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        JWT_SECRET: ${JWT_SECRET}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MAIN_APP_URL: ${NEXT_PUBLIC_MAIN_APP_URL}
        NEXT_PUBLIC_CHALLENGE_APP_URL: ${NEXT_PUBLIC_CHALLENGE_APP_URL}
        NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL}
    container_name: tasks-cash-admin
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      APP_ENV: development
      PORT: 3002
      API_URL: http://api:4000
      COOKIE_DOMAIN: ""
      COOKIE_SECURE: "false"
      AUTH_COOKIE_DOMAIN: ""
    depends_on:
      api:
        condition: service_started
    networks:
      - tasks-cash-net

volumes:
  mongo_data:
  redis_data:

networks:
  tasks-cash-net:
    driver: bridge
